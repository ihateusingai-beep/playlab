<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Score Check</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans HK", sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
        color: white;
        padding: 16px;
      }
      .card {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(6px);
        border-radius: 16px;
        padding: 32px 28px;
        text-align: center;
        max-width: 320px;
        width: 100%;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 20px;
        letter-spacing: 0.02em;
      }
      p.hint {
        margin: 0 0 18px;
        font-size: 12px;
        opacity: 0.85;
      }
      .score {
        font-size: 64px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        line-height: 1;
        margin: 0 0 18px;
      }
      .row {
        display: flex;
        gap: 8px;
        justify-content: center;
      }
      button {
        flex: 1;
        font: inherit;
        font-weight: 700;
        font-size: 14px;
        padding: 10px 14px;
        border-radius: 10px;
        border: 0;
        cursor: pointer;
        background: white;
        color: #4f46e5;
        transition: transform 0.05s ease, opacity 0.1s ease;
      }
      button:hover { opacity: 0.92; }
      button:active { transform: scale(0.97); }
      button.secondary {
        background: rgba(255, 255, 255, 0.18);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.4);
      }
      .status {
        margin-top: 14px;
        font-size: 12px;
        min-height: 16px;
        opacity: 0.95;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>PlayLab</h1>
      <p class="hint">Score-check diagnostic page</p>
      <div class="score" id="score">0</div>
      <div class="row">
        <button id="addBtn" type="button">+ 10</button>
        <button id="sendBtn" class="secondary" type="button">Send score</button>
      </div>
      <p class="status" id="status" aria-live="polite"></p>
    </main>

    <script>
      (function () {
        var score = 0;
        var scoreEl = document.getElementById('score');
        var statusEl = document.getElementById('status');
        var addBtn = document.getElementById('addBtn');
        var sendBtn = document.getElementById('sendBtn');

        function setStatus(text) {
          statusEl.textContent = text;
        }

        function add() {
          score += 10;
          scoreEl.textContent = String(score);
          setStatus('');
        }

        function send() {
          if (score <= 0) {
            setStatus('Add at least 10 points before sending.');
            return;
          }
          try {
            window.parent.postMessage(
              {
                type: 'playlab:score',
                subject: 'tools',
                gameId: 'score-check',
                score: score,
                metadata: { displayName: 'Score Check' }
              },
              '*'
            );
            setStatus('Sent ' + score + ' to host.');
          } catch (e) {
            setStatus('Send failed: ' + (e && e.message ? e.message : 'unknown'));
          }
        }

        addBtn.addEventListener('click', add);
        sendBtn.addEventListener('click', send);

        // Host can ask for a fresh score (e.g. before navigating away).
        window.addEventListener('message', function (event) {
          var data = event.data;
          if (!data || typeof data !== 'object') return;
          if (data.type === 'playlab:requestScore' && score > 0) {
            send();
          }
        });

        // Fire on tab close / refresh — the spec asks us to also handle
        // pagehide and beforeunload.
        function flush() {
          if (score > 0) {
            try {
              window.parent.postMessage(
                {
                  type: 'playlab:score',
                  subject: 'tools',
                  gameId: 'score-check',
                  score: score,
                  metadata: { displayName: 'Score Check' }
                },
                '*'
              );
            } catch (_) {
              // best effort
            }
          }
        }
        window.addEventListener('pagehide', flush);
        window.addEventListener('beforeunload', flush);
      })();
    </script>
  </body>
</html>
